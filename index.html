<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Random jokes</title>
</head>

<body>
    <div class="container">
        <h1 class="title">Random jokes</h1>
        <div class="jokes">
            <img class="jokes__image" src="img/pepe.png" alt="">
            <h2 class="jokes__setup"></h2>
            <p class="jokes__punchline"></p>
        </div>
        <footer>
            <div class="footer__btn">
                <button class="footer__btn--prev">Previous joke</button>
                <button class="footer__btn--answer">Show punchline</button>
                <button class="footer__btn--next">Next joke</button>
            </div>
            <p class="footer__text"></p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>

</html>
